<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="box">
        <img src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo-shadow@2x.png"
            class="rounded mx-auto d-block" alt="...">
        <form>
            <p class="h3 text-center">Please sign in</p>
            <div class="mb-0">
                <input type="email" class="form-control rounded-top-2 rounded-bottom-0 w-25 mx-auto"
                    id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email address">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control rounded-bottom-2 rounded-top-0 w-25 mx-auto"
                    id="exampleInputPassword1" placeholder="Password">
            </div>
            <div class="mb-3 form-check ms-auto d-flex justify-content-center">
                <input type="checkbox" class="form-check-input"id="exampleCheck1">
                <label class="form-check-label d-flex justify-content-center ms-2" for="exampleCheck1">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary mx-auto d-flex justify-content-center p-2 py-2">Sign up</button>
        </form>
    </div>
    <p class="text-center mt-3">&copy;2017 - 2018</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
